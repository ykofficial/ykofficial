<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YK Official - Premium Video Showcase</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body{
      background:#020617;
      overflow:hidden;
    }

    /* Animated background glow */
    .bg-glow{
      position:absolute;
      width:700px;
      height:700px;
      background:radial-gradient(circle, rgba(0,255,255,0.15), transparent 70%);
      filter:blur(40px);
      animation:float 8s ease-in-out infinite;
    }

    .bg-glow2{
      position:absolute;
      width:600px;
      height:600px;
      background:radial-gradient(circle, rgba(168,85,247,0.18), transparent 70%);
      filter:blur(50px);
      animation:float2 10s ease-in-out infinite;
      right:0;
      bottom:0;
    }

    @keyframes float{
      0%,100%{transform:translate(0,0);}
      50%{transform:translate(60px,40px);}
    }

    @keyframes float2{
      0%,100%{transform:translate(0,0);}
      50%{transform:translate(-50px,-30px);}
    }

    /* Floating animation for video */
    .video-card{
      animation: levitate 5s ease-in-out infinite;
    }

    @keyframes levitate{
      0%,100%{
        transform:translateY(0px);
      }
      50%{
        transform:translateY(-12px);
      }
    }

    /* Neon border animation */
    .animated-border::before{
      content:"";
      position:absolute;
      inset:-2px;
      border-radius:30px;
      background:linear-gradient(
        45deg,
        #06b6d4,
        #8b5cf6,
        #06b6d4
      );
      background-size:300% 300%;
      animation:borderMove 6s linear infinite;
      z-index:-1;
    }

    @keyframes borderMove{
      0%{
        background-position:0% 50%;
      }
      50%{
        background-position:100% 50%;
      }
      100%{
        background-position:0% 50%;
      }
    }
  </style>
</head>

<body class="w-screen h-screen flex items-center justify-center relative">

  <!-- Background Effects -->
  <div class="bg-glow top-[-200px] left-[-200px]"></div>
  <div class="bg-glow2"></div>

  <!-- Grid Overlay -->
  <div class="absolute inset-0 opacity-10">
    <div class="w-full h-full"
      style="
      background-image:
      linear-gradient(rgba(255,255,255,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.08) 1px, transparent 1px);
      background-size:40px 40px;">
    </div>
  </div>

  <!-- Main Video Card -->
  <div class="relative z-10 video-card">

    <div class="animated-border relative rounded-[30px] p-[2px]">

      <div class="relative bg-slate-950/90 backdrop-blur-xl rounded-[30px] overflow-hidden shadow-[0_0_60px_rgba(0,255,255,0.15)]">

        <!-- TOP BAR -->
        <div class="absolute top-0 left-0 right-0 z-20 flex items-center justify-between px-6 py-4 bg-gradient-to-b from-black/70 to-transparent">

          <div>
            <h1 class="text-white text-xl md:text-2xl font-black tracking-[4px]">
              YK OFFICIAL
            </h1>

            <p class="text-cyan-300 text-[10px] tracking-[5px] uppercase">
              Mascot Online.
            </p>
          </div>

          <div class="flex items-center gap-2">
            <div class="w-3 h-3 rounded-full bg-red-500"></div>
            <div class="w-3 h-3 rounded-full bg-yellow-400"></div>
            <div class="w-3 h-3 rounded-full bg-green-400"></div>
          </div>
        </div>

        <!-- VIDEO -->
        <video
          id="bgVideo"
          class="w-[92vw] md:w-[1100px] h-[55vw] md:h-[620px] object-cover"
          autoplay
          loop
          playsinline
        >
          <source src="mascot.mp4" type="video/mp4">
        </video>

        <!-- OVERLAY -->
        <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-transparent to-black/30 pointer-events-none"></div>

        <!-- BOTTOM PANEL -->
        <div class="absolute bottom-0 left-0 right-0 z-20 flex items-center justify-between px-6 md:px-8 py-5 bg-gradient-to-t from-black/90 to-transparent">

          <!-- LEFT -->
          <div>
            <h2 class="text-white font-bold text-lg md:text-2xl">
               Mascot Activated
            </h2>

            <p class="text-slate-400 text-xs md:text-sm tracking-wider">
              FUTURISTIC • CINEMATIC • PREMIUM
            </p>
          </div>

          <!-- CONTROLS -->
          <div class="flex items-center gap-4">

            <!-- PLAY BUTTON -->
            <button
              id="playBtn"
              class="group w-14 h-14 rounded-full border border-cyan-400/50 bg-cyan-500/10 backdrop-blur-xl flex items-center justify-center text-cyan-300 hover:bg-cyan-400 hover:text-black transition-all duration-300 hover:scale-110 shadow-[0_0_20px_rgba(0,255,255,0.2)]"
            >

              <svg id="playIcon" class="w-7 h-7 hidden" fill="currentColor" viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z"/>
              </svg>

              <svg id="pauseIcon" class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24">
                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
              </svg>

            </button>

            <!-- VOLUME -->
            <button
              id="volumeBtn"
              class="group w-14 h-14 rounded-full border border-purple-400/50 bg-purple-500/10 backdrop-blur-xl flex items-center justify-center text-purple-300 hover:bg-purple-400 hover:text-black transition-all duration-300 hover:scale-110 shadow-[0_0_20px_rgba(168,85,247,0.2)]"
            >

              <svg id="volumeOnIcon" class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
              </svg>

              <svg id="volumeOffIcon" class="w-7 h-7 hidden" fill="currentColor" viewBox="0 0 24 24">
                <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45z"/>
              </svg>

            </button>

            <!-- BACK BUTTON -->
            <a
              href="javascript:history.back()"
              class="px-5 py-3 rounded-full border border-white/10 bg-white/5 text-slate-300 text-xs tracking-[3px] uppercase hover:bg-white hover:text-black transition-all duration-300"
            >
              Back
            </a>

          </div>
        </div>

      </div>

    </div>

  </div>

  <!-- SCRIPT -->
  <script>

    const video = document.getElementById('bgVideo');
    const playBtn = document.getElementById('playBtn');
    const volumeBtn = document.getElementById('volumeBtn');

    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');

    const volumeOnIcon = document.getElementById('volumeOnIcon');
    const volumeOffIcon = document.getElementById('volumeOffIcon');

    // AUTOPLAY FIX
    window.addEventListener('DOMContentLoaded', () => {

      video.play().catch(() => {

        video.muted = true;

        volumeOnIcon.classList.add('hidden');
        volumeOffIcon.classList.remove('hidden');

      });

    });

    // PLAY / PAUSE
    playBtn.addEventListener('click', () => {

      if(video.paused){

        video.play();

        playIcon.classList.add('hidden');
        pauseIcon.classList.remove('hidden');

      } else {

        video.pause();

        pauseIcon.classList.add('hidden');
        playIcon.classList.remove('hidden');

      }

    });

    // VOLUME
    volumeBtn.addEventListener('click', () => {

      video.muted = !video.muted;

      if(video.muted){

        volumeOnIcon.classList.add('hidden');
        volumeOffIcon.classList.remove('hidden');

      } else {

        volumeOffIcon.classList.add('hidden');
        volumeOnIcon.classList.remove('hidden');

      }

    });

  </script>

</body>
</html>

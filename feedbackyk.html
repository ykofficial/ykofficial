<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YK OFFICIAL - Feedback</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/svg+xml" href="https://i.ibb.co/hJCHgThF/logo-yk-crop.png" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap");
      body { font-family: "Plus Jakarta Sans", sans-serif; }
      .glass-card {
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.5);
        box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.08);
      }
      .float-blob {
        position: absolute;
        width: 380px;
        height: 380px;
        background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        filter: blur(90px);
        border-radius: 50%;
        z-index: -1;
        opacity: 0.15;
        animation: float 10s infinite alternate ease-in-out;
      }
      @keyframes float {
        0% { transform: translate(0, 0) scale(1); }
        100% { transform: translate(90px, 45px) scale(1.08); }
      }
      .input-premium {
        background: rgba(255, 255, 255, 0.6);
        border: 1.5px solid rgba(226, 232, 240, 0.8);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .input-premium:focus {
        border-color: #6366f1;
        background: white;
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
        transform: translateY(-2px);
      }
      .rating-box {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: pointer;
        border: 1.5px solid rgba(226, 232, 240, 0.8);
        background: rgba(255, 255, 255, 0.5);
      }
      .peer:checked + .rating-box {
        background: #0f172a;
        color: white;
        border-color: #0f172a;
        transform: scale(1.06) translateY(-4px);
        box-shadow: 0 15px 25px -5px rgba(15, 23, 42, 0.25);
      }
      .loader-ring {
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top: 3px solid white;
        border-radius: 50%;
        width: 28px;
        height: 28px;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-[#f8fafc] min-h-screen flex items-center justify-center p-6 relative overflow-x-hidden text-slate-800">
    <div id="loader" class="fixed inset-0 bg-[#0b0f1a] flex flex-col items-center justify-center z-[9999] transition-opacity duration-700">
      <div class="absolute w-[400px] h-[400px] bg-indigo-500/20 blur-[120px] rounded-full"></div>
      <div class="relative w-32 h-32 flex items-center justify-center">
        <div class="absolute w-full h-full border-4 border-indigo-500/20 rounded-full"></div>
        <div class="absolute w-full h-full border-4 border-t-indigo-500 border-r-purple-400 border-b-transparent border-l-transparent rounded-full animate-spin"></div>
        <div class="w-4 h-4 bg-indigo-400 rounded-full animate-ping"></div>
      </div>
      <p id="loadingText" class="mt-6 text-gray-300 text-xs font-black tracking-[0.3em] uppercase">Initializing Portal 0%</p>
    </div>

    <script>
      let percent = 0;
      const text = document.getElementById("loadingText");
      const loaderInterval = setInterval(() => {
        percent += 2;
        text.innerText = "INITIALIZING PORTAL " + percent + "%";
        if (percent >= 100) {
          clearInterval(loaderInterval);
          const loader = document.getElementById("loader");
          loader.style.opacity = "0";
          setTimeout(() => loader.style.display = "none", 700);
        }
      }, 15);
    </script>

    <div class="float-blob top-0 left-0"></div>
    <div class="float-blob bottom-0 right-0" style="animation-delay: -5s; background: #3b82f6;"></div>

    <div id="formContainer" class="w-full max-w-2xl glass-card rounded-[2.5rem] overflow-hidden relative z-10 border border-white/80">
      <div class="p-10 pb-6 text-center">
        <div class="inline-block px-4 py-1.5 mb-3 rounded-full bg-slate-900 text-[10px] font-black text-white tracking-[0.2em] uppercase shadow-md">
          YK OFFICIAL SECURE NODE
        </div>
        <h1 class="text-3xl font-black text-slate-900 tracking-tight">Client Experience Portal</h1>
        <p class="text-slate-500 mt-2 font-medium text-xs md:text-sm">Your feedback records directly into our encrypted cloud architecture.</p>
      </div>

      <form id="feedbackForm" class="p-10 pt-2 space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div class="space-y-2">
            <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-1">Full Name</label>
            <input type="text" name="name" required placeholder="Ex: Yegnesh Kamble" class="input-premium w-full px-5 py-4 rounded-2xl outline-none text-slate-700 font-semibold text-sm" />
          </div>
          <div class="space-y-2">
            <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-1">Email Address</label>
            <input type="email" name="email" required placeholder="yk@official.com" class="input-premium w-full px-5 py-4 rounded-2xl outline-none text-slate-700 font-semibold text-sm" />
          </div>
        </div>

        <div class="space-y-2">
          <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-1">How was your overall experience?</label>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <label class="relative">
              <input type="radio" name="rating" value="💎 Excellent" class="peer hidden" required />
              <div class="rating-box p-4 rounded-2xl text-center flex flex-col items-center gap-1.5 shadow-sm">
                <span class="text-xl">💎</span>
                <span class="text-[10px] font-black uppercase tracking-tighter">Excellent</span>
              </div>
            </label>
            <label class="relative">
              <input type="radio" name="rating" value="✨ Good" class="peer hidden" />
              <div class="rating-box p-4 rounded-2xl text-center flex flex-col items-center gap-1.5 shadow-sm">
                <span class="text-xl">✨</span>
                <span class="text-[10px] font-black uppercase tracking-tighter">Good</span>
              </div>
            </label>
            <label class="relative">
              <input type="radio" name="rating" value="⚖️ Average" class="peer hidden" />
              <div class="rating-box p-4 rounded-2xl text-center flex flex-col items-center gap-1.5 shadow-sm">
                <span class="text-xl">⚖️</span>
                <span class="text-[10px] font-black uppercase tracking-tighter">Average</span>
              </div>
            </label>
            <label class="relative">
              <input type="radio" name="rating" value="⚠️ Poor" class="peer hidden" />
              <div class="rating-box p-4 rounded-2xl text-center flex flex-col items-center gap-1.5 shadow-sm">
                <span class="text-xl">⚠️</span>
                <span class="text-[10px] font-black uppercase tracking-tighter">Poor</span>
              </div>
            </label>
          </div>
        </div>

        <div class="space-y-2">
          <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-1">Detailed Message / Remarks</label>
          <textarea name="message" rows="4" required placeholder="Tell us about your interface or platform interaction..." class="input-premium w-full px-5 py-4 rounded-2xl outline-none text-slate-700 font-semibold text-sm resize-none"></textarea>
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-slate-900 text-white font-black py-4.5 rounded-2xl transition-all duration-300 hover:bg-black hover:shadow-2xl flex items-center justify-center gap-3 group text-xs tracking-widest shadow-xl active:scale-95">
          <span>TRANSMIT FEEDBACK RECORD</span>
          <i class="fas fa-paper-plane group-hover:translate-x-1.5 transition-transform text-indigo-400"></i>
        </button>
      </form>
    </div>

    <div id="loaderOverlay" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xl hidden z-50 flex items-center justify-center">
      <div class="bg-white p-8 rounded-3xl text-center shadow-2xl max-w-xs w-full mx-4 border border-white">
        <div class="loader-ring mx-auto mb-4 !border-slate-900 !border-t-indigo-600"></div>
        <p class="text-slate-900 font-black tracking-[0.2em] text-xs uppercase">Encrypting & Syncing...</p>
      </div>
    </div>

    <div id="successModal" class="fixed inset-0 flex items-center justify-center z-[60] hidden px-4">
      <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-md"></div>
      <div class="modal-box bg-white/95 backdrop-blur-3xl rounded-[2.5rem] p-10 max-w-sm w-full text-center shadow-2xl scale-95 opacity-0 transition-all duration-500 relative z-10 border border-white/60">
        <div class="w-20 h-20 bg-slate-900 text-white rounded-full flex items-center justify-center mx-auto mb-6 shadow-xl">
          <i class="fas fa-check text-3xl text-indigo-400"></i>
        </div>
        <h2 class="text-2xl font-black text-slate-900 mb-2">TRANSMISSION SUCCESS</h2>
        <p id="assignedIdText" class="text-indigo-600 text-xs font-black tracking-widest uppercase mb-2">ID: YK-FB8492</p>
        <p class="text-slate-500 mb-8 font-medium text-xs">Your feedback has been safely logged into the YK OFFICIAL database & admin matrix.</p>
        <button onclick="closeModal()" class="w-full bg-slate-900 text-white font-black py-4 rounded-2xl hover:bg-black transition-all text-xs tracking-widest shadow-xl">CONTINUE EXPLORING</button>
      </div>
    </div>

    <script>
      const scriptURL = "https://script.google.com/macros/s/AKfycbyvocv2fdiSc4opkuR0upzigWpAjm83_kzK7w_a1WfxSOsbzVbA94fspiW8S34nMlcz/exec";
      const form = document.getElementById("feedbackForm");
      const loader = document.getElementById("loaderOverlay");
      const modal = document.getElementById("successModal");
      const modalBox = modal.querySelector(".modal-box");
      const submitBtn = document.getElementById("submitBtn");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.innerHTML = "PROCESSING ENCRYPTION...";
        loader.classList.remove("hidden");

        const generatedId = "YK-FB" + Math.floor(1000 + Math.random() * 9000);
        const payload = {
          action: "add",
          id: generatedId,
          name: form.name.value,
          email: form.email.value,
          rating: form.rating.value,
          message: form.message.value
        };

        let existingLocal = JSON.parse(localStorage.getItem("yk_feedbacks") || "[]");
        existingLocal.unshift(payload);
        localStorage.setItem("yk_feedbacks", JSON.stringify(existingLocal));

        try {
          await fetch(scriptURL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
        } catch (err) {
          console.warn("Network request warning:", err);
        } finally {
          loader.classList.add("hidden");
          document.getElementById("assignedIdText").innerText = `RECORD ID: ${generatedId}`;
          showModal();
          form.reset();
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span class="tracking-widest">TRANSMIT FEEDBACK RECORD</span><i class="fas fa-paper-plane text-indigo-400"></i>';
        }
      });

      function showModal() {
        modal.classList.remove("hidden");
        setTimeout(() => {
          modalBox.classList.remove("scale-95", "opacity-0");
          modalBox.classList.add("scale-100", "opacity-100");
        }, 50);
      }

      function closeModal() {
        modalBox.classList.add("scale-95", "opacity-0");
        setTimeout(() => modal.classList.add("hidden"), 300);
      }
    </script>
  </body>
</html>

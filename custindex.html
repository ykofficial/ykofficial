<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YK OFFICIAL - Secure Client Portal</title>
    <link rel="icon" href="https://i.ibb.co/hJCHgThF/logo-yk-crop.png" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <!-- url id code  -->
    <script>
      function updateUrlWithUniqueId() {
        const uniqueId = Math.random()
          .toString(36)
          .substring(2, 8)
          .toUpperCase();
        const pageName =
          window.location.pathname.split("/").pop().split(".")[0] || "home";
        const newHash = `#${pageName}?uid=yKOfFiciAl${uniqueId}`;
        window.history.replaceState(null, null, newHash);
      }

      window.addEventListener("DOMContentLoaded", updateUrlWithUniqueId);
      window.addEventListener("hashchange", updateUrlWithUniqueId);
    </script>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap");

      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #090d16 50%, #020617 100%);
        background-attachment: fixed;
      }

      .glass-panel {
        background: rgba(15, 23, 42, 0.75);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.7), 0 0 40px rgba(79, 70, 229, 0.1);
      }

      .input-glow {
        background: rgba(2, 6, 23, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.08);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        color: #f8fafc;
      }

      .input-glow:focus {
        border-color: #6366f1;
        background: rgba(15, 23, 42, 0.9);
        outline: none;
        box-shadow: 0 0 20px rgba(99, 102, 241, 0.25), inset 0 0 10px rgba(99, 102, 241, 0.1);
      }

      .btn-cyber {
        background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        transition: all 0.3s ease;
        box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.4);
      }

      .btn-cyber:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 15px 30px -5px rgba(79, 70, 229, 0.6);
        filter: brightness(1.1);
      }

      /* Ambient 4K Glow Background Spheres */
      .ambient-glow {
        position: fixed;
        width: 400px;
        height: 400px;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, transparent 70%);
        top: 20%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: -1;
        pointer-events: none;
        filter: blur(60px);
      }

      html { scroll-behavior: smooth; }
      body { overflow-x: hidden; }
      
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
  </head>
  <body class="min-h-screen text-slate-100 flex flex-col items-center justify-center p-3 sm:p-6">
    <div class="ambient-glow"></div>

    <!-- Main Container Optimized for Popup Embedding -->
    <main class="w-full max-w-lg mx-auto">
      <div class="glass-panel rounded-3xl p-6 sm:p-8 relative overflow-hidden">
        
        <!-- Top Brand Accent line -->
        <div class="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-transparent via-indigo-500 to-transparent"></div>

        <!-- Header Section -->
        <div class="text-center mb-8">
          <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 mb-3 shadow-inner">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
            </svg>
          </div>
          <h2 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white mb-1">YK OFFICIAL</h2>
          <p class="text-slate-400 text-xs sm:text-sm font-medium tracking-wide uppercase">Secure Client Registration Portal</p>
        </div>

        <!-- Step Indicator Progress Bar -->
        <div class="flex items-center justify-between mb-8 px-2 relative">
          <div class="absolute top-1/2 left-4 right-4 h-[2px] bg-slate-800 -z-10 -translate-y-1/2"></div>
          
          <div id="step1-icon" class="step-icon w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold bg-indigo-600 text-white ring-4 ring-indigo-500/20 transition-all duration-500 shadow-lg shadow-indigo-600/30">1</div>
          <div id="step2-icon" class="step-icon w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold bg-slate-800 text-slate-400 border border-slate-700 transition-all duration-500">2</div>
          <div id="step3-icon" class="step-icon w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold bg-slate-800 text-slate-400 border border-slate-700 transition-all duration-500">3</div>
        </div>

        <!-- Verification Area (Step 1 & 2) -->
        <div id="verification-area" class="space-y-4 animate-fade">
          <div class="relative">
            <input
              id="email"
              type="email"
              placeholder="Enter corporate email address"
              class="input-glow w-full px-4 py-3.5 rounded-xl text-sm placeholder:text-slate-500"
            />
          </div>
          
          <button
            onclick="sendOTP()"
            class="btn-cyber w-full py-3.5 rounded-xl font-bold text-xs uppercase tracking-wider text-white"
          >
            Request Access Code
          </button>

          <div class="pt-2 flex gap-3">
            <input
              id="otp"
              placeholder="••••••"
              maxlength="6"
              class="input-glow w-1/2 py-3.5 rounded-xl text-center font-mono text-lg tracking-[0.4em] placeholder:tracking-normal placeholder:text-sm placeholder:font-sans placeholder:text-slate-500"
            />
            <button
              onclick="verifyOTP()"
              class="w-1/2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs uppercase tracking-wider rounded-xl transition-all shadow-lg shadow-emerald-600/20"
            >
              Verify Identity
            </button>
          </div>

          <div class="mt-3 text-center">
            <button
              id="resendBtn"
              onclick="sendOTP()"
              disabled
              class="text-xs text-slate-500 font-medium hover:text-indigo-400 transition-colors disabled:cursor-not-allowed disabled:hover:text-slate-500"
            >
              Resend OTP <span id="timer" class="font-semibold text-indigo-400">(30s)</span>
            </button>
          </div>
        </div>

        <!-- Project Brief Form (Step 3) -->
        <div id="form" class="hidden space-y-4 animate-fade">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <input
              id="name"
              placeholder="Full Name"
              class="input-glow p-3.5 rounded-xl text-sm placeholder:text-slate-500"
            />
            <input
              id="phone"
              placeholder="Contact Number"
              class="input-glow p-3.5 rounded-xl text-sm placeholder:text-slate-500"
            />
          </div>

          <div class="relative">
            <select
              id="service"
              class="input-glow w-full p-3.5 rounded-xl text-sm appearance-none bg-slate-900 cursor-pointer"
            >
              <option class="bg-slate-900 text-white">Website Development</option>
              <option class="bg-slate-900 text-white">UI Design & Branding</option>
              <option class="bg-slate-900 text-white">Portfolio Website</option>
              <option class="bg-slate-900 text-white">Custom IT Solution</option>
            </select>
            <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </div>
          </div>

          <textarea
            id="message"
            rows="3"
            placeholder="Briefly describe your project goals and requirements..."
            class="input-glow w-full p-3.5 rounded-xl text-sm resize-none placeholder:text-slate-500"
          ></textarea>

          <button
            onclick="submitForm()"
            id="submitBtn"
            class="btn-cyber w-full py-3.5 rounded-xl font-bold text-xs uppercase tracking-wider text-white shadow-lg"
          >
            Submit Project Brief
          </button>
        </div>

        <!-- Footer watermark inside card -->
        <div class="mt-8 pt-4 border-t border-white/5 text-center">
          <p class="text-[10px] text-slate-500 uppercase tracking-widest font-semibold">
            YK OFFICIAL &bull; Encrypted Portal Session
          </p>
        </div>
      </div>
    </main>

    <!-- Global Cinematic Loader Overlay -->
    <div id="global-loader" class="hidden fixed inset-0 z-[120] bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
      <div class="glass-panel border border-indigo-500/30 p-8 rounded-3xl max-w-xs w-full text-center shadow-2xl animate-fade space-y-4">
        <div class="relative w-16 h-16 mx-auto">
          <div class="absolute inset-0 rounded-full border-4 border-indigo-500/20"></div>
          <div class="absolute inset-0 rounded-full border-4 border-indigo-500 border-t-transparent animate-spin"></div>
        </div>
        <div>
          <h4 class="text-white font-bold text-sm tracking-wider uppercase mb-1">YK OFFICIAL</h4>
          <p id="loaderText" class="text-slate-400 text-xs">Securing transmission...</p>
        </div>
      </div>
    </div>

    <!-- Popup Notification Modal -->
    <div id="popup" class="hidden fixed inset-0 z-[110] bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
      <div class="glass-panel border border-white/10 p-6 sm:p-8 rounded-3xl max-w-xs w-full text-center shadow-2xl animate-fade">
        <div class="w-12 h-12 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 flex items-center justify-center mx-auto mb-4">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </div>
        <h3 id="popupTitle" class="text-lg font-bold text-white mb-2"></h3>
        <p id="popupMsg" class="text-slate-300 mb-6 text-xs sm:text-sm leading-relaxed"></p>
        <button
          onclick="closePopup()"
          class="btn-cyber w-full py-3 rounded-xl font-bold text-xs uppercase tracking-wider text-white"
        >
          Understood
        </button>
      </div>
    </div>

    <!-- Core Scripts (APIs and Logic Preserved) -->
    <script>
      emailjs.init("IjcMdGc7hhe75v6JE");
      let otpCode;
      const API =
        "https://script.google.com/macros/s/AKfycbwnBjAJdDDIwefyafJ1_1jAh84Vsgr9oslrvaPTYC5BN5Bpra-PkfgcDQ4dlWGw7q6T/exec";

      function updateStepUI(stepNumber) {
        for (let i = 1; i <= 3; i++) {
          const stepIcon = document.getElementById(`step${i}-icon`);
          if (i <= stepNumber) {
            stepIcon.className = "step-icon w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold bg-indigo-600 text-white ring-4 ring-indigo-500/20 transition-all duration-500 shadow-lg shadow-indigo-600/30";
          } else {
            stepIcon.className = "step-icon w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold bg-slate-800 text-slate-400 border border-slate-700 transition-all duration-500";
          }
        }
      }

      function showLoader(message = "Processing secure request...") {
        document.getElementById("loaderText").innerText = message;
        document.getElementById("global-loader").classList.remove("hidden");
      }
      
      function hideLoader() {
        document.getElementById("global-loader").classList.add("hidden");
      }

      function showPopup(title, msg) {
        document.getElementById("popupTitle").innerText = title;
        document.getElementById("popupMsg").innerText = msg;
        document.getElementById("popup").classList.remove("hidden");
      }
      
      function closePopup() {
        document.getElementById("popup").classList.add("hidden");
      }

      let timerInterval;

      function startTimer() {
        const resendBtn = document.getElementById("resendBtn");
        const timerText = document.getElementById("timer");
        let timeLeft = 30;

        resendBtn.disabled = true;
        clearInterval(timerInterval);

        timerInterval = setInterval(() => {
          timeLeft--;
          if (timeLeft <= 0) {
            clearInterval(timerInterval);
            resendBtn.disabled = false;
            timerText.innerText = "";
          } else {
            timerText.innerText = `(${timeLeft}s)`;
          }
        }, 1000);
      }

      async function sendOTP() {
        let email = document.getElementById("email").value;
        if (!email || !email.includes("@"))
          return showPopup("Required Field", "Please provide a valid corporate email address.");

        otpCode = Math.floor(100000 + Math.random() * 900000);
        showLoader("Dispatching access code...");
        try {
          await emailjs.send("service_9uwcu9x", "template_51t8llg", {
            email,
            otp: otpCode,
          });
          hideLoader();
          showPopup("Dispatch Successful", "Security verification code has been sent to your inbox.");
          updateStepUI(2);
          startTimer();
        } catch (e) {
          hideLoader();
          showPopup("Transmission Error", "Failed to dispatch verification code.");
        }
      }

      function verifyOTP() {
        let user = document.getElementById("otp").value;
        if (user == otpCode && otpCode != null) {
          document.getElementById("verification-area").classList.add("hidden");
          document.getElementById("form").classList.remove("hidden");
          updateStepUI(3);
          showPopup("Identity Confirmed", "You may now complete your project specifications.");
        } else {
          showPopup("Security Alert", "Invalid verification code entered. Please check your inbox.");
        }
      }

      function generateCustomerID(name) {
        let parts = name.trim().split(" ");
        let initials = (
          parts[0][0] + (parts[parts.length - 1][0] || "X")
        ).toUpperCase();
        let randomNum = Math.floor(1000 + Math.random() * 9000);
        return initials + randomNum;
      }

      async function submitForm() {
        let btn = document.getElementById("submitBtn");
        let name = document.getElementById("name").value;
        if (!name) return showPopup("Incomplete Details", "Please enter your full name.");

        btn.disabled = true;
        let customerID = generateCustomerID(name);
        let data = {
          id: customerID,
          name: name,
          email: document.getElementById("email").value,
          phone: document.getElementById("phone").value,
          service: document.getElementById("service").value,
          message: document.getElementById("message").value,
        };

        showLoader("Logging project ticket...");
        try {
          await fetch(API, { method: "POST", body: JSON.stringify(data) });
          await emailjs.send("service_9uwcu9x", "template_94xq6yl", {
            name: data.name,
            email: data.email,
            phone: data.phone,
            service: data.service,
            customer_id: customerID,
          });
          hideLoader();
          showPopup(
            "Inquiry Logged Successfully",
            "Ticket #" + customerID + " generated. Refreshing portal...",
          );
          setTimeout(() => location.reload(), 3000);
        } catch (err) {
          hideLoader();
          btn.disabled = false;
          showPopup("System Error", "Communication link failed. Please try again.");
        }
      }

      // Security Warning Handler
      function showWarning() {
        document.body.innerHTML = `
            <div style="height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#020617;color:#fff;font-family:sans-serif;text-align:center;padding:20px;">
                <h1 style="font-size:28px;margin-bottom:12px;color:#ef4444;font-weight:700;">⚠ SECURITY BREACH DETECTED</h1>
                <p style="font-size:14px;max-width:400px;color:#94a3b8;line-height:1.5;">Developer tools and inspection are restricted on YK OFFICIAL secure portals.</p>
            </div>`;
      }
      document.addEventListener("contextmenu", (e) => {
        e.preventDefault();
        showWarning();
      });
    </script>
  </body>
</html>

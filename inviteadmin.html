<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>YK OFFICIAL | Invitation Admin</title>
    <link rel="icon" href="https://i.ibb.co/hJCHgThF/logo-yk-crop.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: Inter, sans-serif;
      }
      .field {
        width: 100%;
        border: 1px solid #e2e8f0;
        background: #f8fafc;
        border-radius: 14px;
        padding: 12px;
        outline: 0;
      }
      .field:focus {
        border-color: #6366f1;
        box-shadow: 0 0 0 4px #6366f11a;
        background: white;
      }
      .spin {
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .modal {
        animation: up 0.22s ease;
      }
      @keyframes up {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      ::-webkit-scrollbar {
        width: 7px;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 9px;
      }
    </style>
  </head>
  <body class="min-h-screen bg-slate-950">
    <div
      id="loader"
      class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-950"
    >
      <div class="text-center">
        <div class="relative mx-auto h-20 w-20">
          <div
            class="absolute inset-0 rounded-3xl border border-white/10"
          ></div>
          <div
            class="absolute inset-1 rounded-3xl border-2 border-indigo-500 border-t-transparent spin"
          ></div>
          <img
            src="https://i.ibb.co/hJCHgThF/logo-yk-crop.png"
            class="absolute inset-4 h-12 w-12 rounded-2xl"
          />
        </div>
        <div class="mt-6 text-xs font-extrabold tracking-[.35em] text-white">
          YK <span class="text-indigo-400">OFFICIAL</span>
        </div>
        <div class="mx-auto mt-4 h-1 w-48 overflow-hidden rounded bg-white/10">
          <div
            id="bar"
            class="h-full w-0 bg-indigo-500 transition-all duration-[1400ms]"
          ></div>
        </div>
      </div>
    </div>
    <div
      class="min-h-screen bg-[radial-gradient(circle_at_15%_0,#312e81,transparent_28%),#f8fafc]"
    >
      <header
        class="sticky top-0 z-40 border-b border-white/10 bg-slate-950/90 text-white backdrop-blur-xl"
      >
        <div
          class="mx-auto flex h-16 max-w-[1600px] items-center justify-between px-4 sm:px-6"
        >
          <div class="flex items-center gap-3">
            <img
              src="https://i.ibb.co/hJCHgThF/logo-yk-crop.png"
              class="h-9 w-9 rounded-xl"
            />
            <div>
              <b class="text-sm"
                >YK<span class="text-indigo-400">OFFICIAL</span></b
              >
              <div class="text-[9px] uppercase tracking-[.22em] text-slate-500">
                Invitation Admin
              </div>
            </div>
          </div>
          <div class="flex gap-2">
            <button
              onclick="openSheet()"
              class="hidden rounded-xl border border-white/10 px-3 py-2 text-xs font-bold sm:block"
            >
              Google Sheet ↗</button
            ><button
              onclick="load()"
              class="rounded-xl bg-indigo-600 px-3 py-2 text-xs font-bold"
            >
              Refresh
            </button>
          </div>
        </div>
      </header>
      <main class="mx-auto max-w-[1600px] px-4 py-6 sm:px-6">
        <div class="grid gap-4 md:grid-cols-3">
          <div class="rounded-2xl border bg-white p-5 shadow-sm">
            <small class="font-bold uppercase tracking-widest text-slate-400"
              >Total invitations</small
            >
            <div id="total" class="mt-2 text-3xl font-extrabold">—</div>
          </div>
          <div class="rounded-2xl border bg-white p-5 shadow-sm">
            <small class="font-bold uppercase tracking-widest text-slate-400"
              >Latest request</small
            >
            <div id="latest" class="mt-2 truncate text-sm font-extrabold">
              —
            </div>
          </div>
          <div class="rounded-2xl border bg-white p-5 shadow-sm">
            <small class="font-bold uppercase tracking-widest text-slate-400"
              >Connection</small
            >
            <div class="mt-2 text-sm font-bold">
              <span
                class="mr-2 inline-block h-2 w-2 rounded-full bg-green-500"
              ></span
              ><span id="status">Checking…</span>
            </div>
          </div>
        </div>
        <section
          class="mt-5 overflow-hidden rounded-[1.5rem] border bg-white shadow-xl"
        >
          <div
            class="flex flex-col gap-3 border-b p-5 sm:flex-row sm:items-center sm:justify-between"
          >
            <div>
              <div
                class="text-[10px] font-extrabold uppercase tracking-widest text-indigo-600"
              >
                Live records
              </div>
              <h1 class="text-xl font-extrabold">Invitation Requests</h1>
            </div>
            <div class="flex gap-2">
              <input
                id="search"
                oninput="render()"
                class="field sm:w-64"
                placeholder="Search name, email, ID…"
              /><button
                onclick="openSheet()"
                class="rounded-xl border px-4 text-xs font-bold"
              >
                Sheet
              </button>
            </div>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full min-w-[1000px] text-left text-sm">
              <thead
                class="bg-slate-50 text-[10px] uppercase tracking-widest text-slate-400"
              >
                <tr>
                  <th class="p-4">Request</th>
                  <th class="p-4">Guest</th>
                  <th class="p-4">Event</th>
                  <th class="p-4">Date</th>
                  <th class="p-4">Contact</th>
                  <th class="p-4 text-right">Actions</th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
          <div id="empty" class="hidden p-12 text-center text-slate-400">
            No invitations found.
          </div>
        </section>
      </main>
    </div>
    <div
      id="actionLoader"
      class="fixed inset-0 z-[90] hidden items-center justify-center bg-slate-950/60 p-5 backdrop-blur-md"
    >
      <div
        class="modal w-full max-w-sm rounded-[2rem] bg-white p-7 text-center"
      >
        <div
          class="mx-auto h-12 w-12 rounded-full border-4 border-indigo-600 border-t-transparent spin"
        ></div>
        <h3 id="lt" class="mt-5 font-extrabold">Updating</h3>
        <p id="lm" class="mt-2 text-sm text-slate-500">Please wait…</p>
      </div>
    </div>
    <div
      id="modal"
      class="fixed inset-0 z-[80] hidden items-center justify-center bg-slate-950/60 p-4 backdrop-blur-md"
    >
      <div
        class="modal max-h-[92vh] w-full max-w-2xl overflow-y-auto rounded-[2rem] bg-white p-6"
      >
        <div class="flex justify-between">
          <div>
            <div
              id="mTag"
              class="text-[10px] font-bold uppercase tracking-widest text-indigo-600"
            >
              Invitation
            </div>
            <h2 id="mTitle" class="mt-1 text-2xl font-extrabold">Details</h2>
          </div>
          <button onclick="closeM()" class="h-9 w-9 rounded-full bg-slate-100">
            ×
          </button>
        </div>
        <form id="form" class="mt-5 grid gap-4 sm:grid-cols-2">
          <input type="hidden" name="id" /><label
            >Name<input class="field mt-1" name="name" required /></label
          ><label>Email<input class="field mt-1" name="email" required /></label
          ><label>Phone<input class="field mt-1" name="phone" required /></label
          ><label
            >Date<input class="field mt-1" type="date" name="date" /></label
          ><label class="sm:col-span-2"
            >Event<input class="field mt-1" name="event" /></label
          ><label class="sm:col-span-2"
            >Purpose<textarea
              class="field mt-1 min-h-28"
              name="purpose"
            ></textarea>
          </label>
          <div class="flex gap-2 sm:col-span-2 sm:justify-end">
            <button
              type="button"
              onclick="closeM()"
              class="rounded-xl border px-5 py-3 text-sm font-bold"
            >
              Cancel</button
            ><button
              class="rounded-xl bg-indigo-600 px-5 py-3 text-sm font-bold text-white"
            >
              Save Changes
            </button>
          </div>
        </form>
      </div>
    </div>
    <div
      id="reply"
      class="fixed inset-0 z-[85] hidden items-center justify-center bg-slate-950/60 p-4 backdrop-blur-md"
    >
      <div class="modal w-full max-w-2xl rounded-[2rem] bg-white p-6">
        <div class="flex justify-between">
          <div>
            <div
              class="text-[10px] font-bold uppercase tracking-widest text-indigo-600"
            >
              Direct response
            </div>
            <h2 class="mt-1 text-2xl font-extrabold">Reply by Email</h2>
          </div>
          <button
            onclick="closeReply()"
            class="h-9 w-9 rounded-full bg-slate-100"
          >
            ×
          </button>
        </div>
        <form id="replyForm" class="mt-5 space-y-4">
          <input type="hidden" name="to" /><input
            type="hidden"
            name="requestId"
          /><label
            >Recipient<input
              id="to"
              class="field mt-1 bg-slate-50"
              readonly /></label
          ><label
            >Subject<input name="subject" class="field mt-1" required /></label
          ><label
            >Message<textarea
              name="message"
              class="field mt-1 min-h-44"
              required
            ></textarea></label
          ><button
            class="w-full rounded-xl bg-slate-950 py-3.5 text-sm font-bold text-white"
          >
            Send Official Reply
          </button>
        </form>
      </div>
    </div>
    <div
      id="history"
      class="fixed inset-0 z-[85] hidden items-center justify-center bg-slate-950/60 p-4 backdrop-blur-md"
    >
      <div class="modal w-full max-w-xl rounded-[2rem] bg-white p-6">
        <div class="flex justify-between">
          <div>
            <div
              class="text-[10px] font-bold uppercase tracking-widest text-indigo-600"
            >
              Audit trail
            </div>
            <h2 class="mt-1 text-2xl font-extrabold">History</h2>
          </div>
          <button
            onclick="closeHistory()"
            class="h-9 w-9 rounded-full bg-slate-100"
          >
            ×
          </button>
        </div>
        <div
          id="historyList"
          class="mt-5 max-h-[55vh] space-y-3 overflow-y-auto"
        ></div>
      </div>
    </div>
    <div
      id="toast"
      class="fixed bottom-5 left-1/2 z-[120] hidden -translate-x-1/2 rounded-2xl bg-slate-950 px-5 py-3 text-xs font-bold text-white"
    ></div>
    <script>
      const API =
          "https://script.google.com/macros/s/AKfycbyUJSruVELA_wCcyNQN9WJKIXjk65aL_A15gPkRnr19d9x0TNiwdaR-9vkcLq_t1W1q/exec",
        SHEET = API;
      const EMAILJS_SERVICE = "service_dgrc179",
        EMAILJS_TEMPLATE = "template_qxhyh7i";
      emailjs.init("9P9_Nz0_Es2Y6Ffvm");
      let data = [],
        selected = null,
        history = JSON.parse(localStorage.ykInviteHistory || "{}");
      const $ = (x) => document.getElementById(x);
      function show(id) {
        $(id).classList.remove("hidden");
        $(id).classList.add("flex");
      }
      function hide(id) {
        $(id).classList.add("hidden");
        $(id).classList.remove("flex");
      }
      function busy(on, t = "Updating", m = "Please wait…") {
        on ? show("actionLoader") : hide("actionLoader");
        $("lt").textContent = t;
        $("lm").textContent = m;
      }
      function toast(x) {
        $("toast").textContent = x;
        $("toast").classList.remove("hidden");
        clearTimeout(window.tt);
        window.tt = setTimeout(() => $("toast").classList.add("hidden"), 2600);
      }
      function esc(v) {
        return String(v ?? "").replace(
          /[&<>"']/g,
          (m) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#039;",
            })[m],
        );
      }
      function norm(x) {
        return Array.isArray(x)
          ? {
              id: x[0],
              name: x[1],
              email: x[2],
              phone: x[3],
              date: x[4],
              event: x[5],
              purpose: x[6],
              timestamp: x[7],
              source: x[8],
            }
          : {
              id: x.id || x.ID,
              name: x.name || x.Name,
              email: x.email || x.Email,
              phone: x.phone || x.Phone,
              date: x.date || x["Event Date"],
              event: x.event || x["Event Type"],
              purpose: x.purpose || x.Purpose,
              timestamp: x.timestamp || x.Timestamp,
              source: x.source || x.Source,
            };
      }
      async function load() {
        busy(true, "Loading invitations", "Syncing Google Sheet…");
        try {
          let r = await fetch(API + "?action=list&t=" + Date.now());
          let j = await r.json();
          data = (
            j.data ||
            j.rows ||
            j.invitations ||
            j.records ||
            j ||
            []
          ).map(norm);
          $("status").textContent = "Connected to Google Sheet";
          $("total").textContent = data.length;
          let l = data[data.length - 1];
          $("latest").textContent = l?.id || "—";
          render();
        } catch (e) {
          $("status").textContent = "Connection unavailable";
          toast("Could not read Google Sheet.");
        } finally {
          busy(false);
        }
      }
      function render() {
        let q = $("search").value.toLowerCase(),
          a = data.filter((r) =>
            [r.id, r.name, r.email, r.phone, r.event, r.purpose]
              .join(" ")
              .toLowerCase()
              .includes(q),
          );
        $("rows").innerHTML = a
          .map(
            (r) =>
              `<tr class="border-t hover:bg-indigo-50/30"><td class="p-4"><b class="text-indigo-600">${esc(r.id)}</b><div class="text-[10px] text-slate-400">${esc(r.timestamp)}</div></td><td class="p-4"><b>${esc(r.name)}</b><div class="text-xs text-slate-400">${esc(r.email)}</div></td><td class="p-4"><b>${esc(r.event)}</b><div class="max-w-xs truncate text-xs text-slate-400">${esc(r.purpose)}</div></td><td class="p-4">${esc(r.date)}</td><td class="p-4">${esc(r.phone)}</td><td class="p-4"><div class="flex justify-end gap-2"><button onclick="view('${encodeURIComponent(r.id)}')" class="rounded-lg border px-3 py-2 text-[10px] font-bold">Details</button><button onclick="edit('${encodeURIComponent(r.id)}')" class="rounded-lg bg-indigo-600 px-3 py-2 text-[10px] font-bold text-white">Edit</button><button onclick="del('${encodeURIComponent(r.id)}')" class="rounded-lg bg-red-50 px-3 py-2 text-[10px] font-bold text-red-600">Delete</button></div></td></tr>`,
          )
          .join("");
        $("empty").classList.toggle("hidden", a.length > 0);
      }
      function get(id) {
        return data.find((x) => String(x.id) === String(id));
      }
      function view(id) {
        selected = get(decodeURIComponent(id));
        if (!selected) return;
        openReply(selected, false);
        closeReply();
        showDetails(selected);
      }
      function showDetails(r) {
        let html = Object.entries({
          ID: r.id,
          Name: r.name,
          Email: r.email,
          Phone: r.phone,
          "Event Date": r.date,
          "Event Type": r.event,
          Purpose: r.purpose,
          Timestamp: r.timestamp,
          Source: r.source,
        })
          .map(
            ([k, v]) =>
              `<div class="rounded-xl bg-slate-50 p-3"><small class="font-bold uppercase text-slate-400">${esc(k)}</small><div class="mt-1 whitespace-pre-wrap break-words text-sm font-semibold">${esc(v || "—")}</div></div>`,
          )
          .join("");
        $("mTag").textContent = "Full invitation details";
        $("mTitle").textContent = r.name || "Invitation";
        $("form").innerHTML =
          `<div class="sm:col-span-2 grid gap-3 sm:grid-cols-2">${html}</div><div class="flex flex-wrap gap-2 sm:col-span-2"><button type="button" onclick="edit('${encodeURIComponent(r.id)}')" class="rounded-xl bg-indigo-600 px-4 py-3 text-sm font-bold text-white">Edit</button><button type="button" onclick="replyTo('${encodeURIComponent(r.id)}')" class="rounded-xl bg-slate-950 px-4 py-3 text-sm font-bold text-white">Reply by Email</button><button type="button" onclick="openHistory('${encodeURIComponent(r.id)}')" class="rounded-xl border px-4 py-3 text-sm font-bold">History</button></div>`;
        show("modal");
      }
      function edit(id) {
        selected = get(decodeURIComponent(id));
        if (!selected) return;
        $("mTag").textContent = "Record management";
        $("mTitle").textContent = "Edit Invitation";
        $("form").innerHTML =
          `<input type="hidden" name="id"><label>Name<input class="field mt-1" name="name" required></label><label>Email<input class="field mt-1" name="email" required></label><label>Phone<input class="field mt-1" name="phone"></label><label>Date<input class="field mt-1" type="date" name="date"></label><label class="sm:col-span-2">Event<input class="field mt-1" name="event"></label><label class="sm:col-span-2">Purpose<textarea class="field mt-1 min-h-28" name="purpose"></textarea></label><div class="flex gap-2 sm:col-span-2 sm:justify-end"><button type="button" onclick="closeM()" class="rounded-xl border px-5 py-3 font-bold">Cancel</button><button class="rounded-xl bg-indigo-600 px-5 py-3 font-bold text-white">Save Changes</button></div>`;
        let f = $("form");
        Object.keys(selected).forEach((k) => {
          if (f.elements[k]) f.elements[k].value = selected[k] || "";
        });
        show("modal");
      }
      $("form").onsubmit = async (e) => {
        e.preventDefault();
        let d = Object.fromEntries(new FormData(e.target));
        if (!d.id) return closeM();
        d.action = "update";
        busy(true, "Updating invitation", "Saving changes to Google Sheet…");
        try {
          await api(d);
          saveH(d.id, "Invitation details edited");
          closeM();
          toast("Invitation updated in Google Sheet.");
          load();
        } catch (x) {
          toast(x.message);
        } finally {
          busy(false);
        }
      };
      async function api(d) {
        let r = await fetch(API, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(d),
        });
        let j = {};
        try {
          j = await r.json();
        } catch (e) {}
        if (!r.ok || j.success === false)
          throw Error(j.message || "API request failed");
        return j;
      }
      function del(id) {
        selected = get(decodeURIComponent(id));
        if (
          confirm(
            "Delete " +
              selected.id +
              "? This will delete the connected Google Sheet row.",
          )
        ) {
          busy(
            true,
            "Deleting invitation",
            "Removing record from Google Sheet…",
          );
          api({ action: "delete", id: selected.id })
            .then(() => {
              saveH(selected.id, "Invitation deleted");
              toast("Invitation deleted.");
              load();
            })
            .catch((e) => toast(e.message))
            .finally(() => busy(false));
        }
      }
      function replyTo(id) {
        selected = get(decodeURIComponent(id));
        openReply(selected, true);
      }
      function openReply(r, open = true) {
        $("replyForm").to.value = r.email || "";
        $("to").value = r.email || "";
        $("replyForm").requestId.value = r.id || "";
        $("replyForm").subject.value = "Re: Invitation Request " + r.id;
        $("replyForm").message.value =
          `Dear ${r.name || "Guest"},\n\nThank you for contacting YK OFFICIAL regarding your invitation request (${r.id || ""}).\n\nRegards,\nYK OFFICIAL`;
        if (open) {
          closeM();
          show("reply");
        }
      }
      function closeReply() {
        hide("reply");
      }
      $("replyForm").onsubmit = async (e) => {
        e.preventDefault();
        let d = Object.fromEntries(new FormData(e.target));
        busy(true, "Sending reply", "Sending official email…");
        try {
          await emailjs.send(EMAILJS_SERVICE, EMAILJS_TEMPLATE, {
            to_email: d.to,
            to_name: selected.name,
            subject: d.subject,
            message: d.message,
            request_id: d.requestId,
          });
          saveH(d.requestId, "Email reply sent to " + d.to);
          closeReply();
          toast("Email reply sent successfully.");
        } catch (x) {
          toast("Email failed. Check EmailJS template variables.");
        } finally {
          busy(false);
        }
      };
      function saveH(id, a) {
        history[id] ??= [];
        history[id].unshift({ a, t: new Date().toLocaleString("en-IN") });
        localStorage.ykInviteHistory = JSON.stringify(history);
      }
      function openHistory(id) {
        let r = get(decodeURIComponent(id));
        let h = history[r.id] || [
          { a: "Record loaded from Google Sheet", t: r.timestamp || "Unknown" },
        ];
        $("historyList").innerHTML = h
          .map(
            (x) =>
              `<div class="rounded-xl bg-slate-50 p-4"><b class="text-sm">${esc(x.a)}</b><div class="mt-1 text-xs text-slate-400">${esc(x.t)}</div></div>`,
          )
          .join("");
        show("history");
      }
      function closeHistory() {
        hide("history");
      }
      function closeM() {
        hide("modal");
      }
      function openSheet() {
        window.open(SHEET, "_blank", "noopener");
      }
      window.addEventListener("load", () => {
        $("bar").style.width = "100%";
        setTimeout(() => {
          $("loader").remove();
          load();
        }, 1500);
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closeM();
          closeReply();
          closeHistory();
          hide("actionLoader");
        }
      });
    </script>
    <script src="security.js"></script>
  </body>
</html>
